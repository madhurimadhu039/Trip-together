<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripTogether — AI-Powered Family Trip Planner</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Preserves sub-routes and query strings on refresh
      sessionStorage.redirect = location.href;
      var pathSegments = location.pathname.split('/');
      var base = '/' + (pathSegments[1] || '');
      if (pathSegments[2] === 'docs') {
        base += '/docs';
      }
      location.replace(base + '/');
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; text-align: center; padding-top: 60px; background-color: #FAF9F6; color: #1E332A;">
    <h2>TripTogether</h2>
    <p>Loading application...</p>
  </body>
</html>
